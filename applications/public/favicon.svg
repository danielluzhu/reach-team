<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Rental application</title>
  <!-- The house emoji, set as text like the checklist's clipboard: on a phone
       the emoji font is part of the system and reads better at 16px than any
       outline would. -->
  <text x="50%" y="50%" font-size="56" text-anchor="middle" dominant-baseline="central"
        font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🏠</text>
</svg>
