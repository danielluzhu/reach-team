<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>R</title>
  <!-- One heavy slanted R, drawn as a path rather than set in a font so it
       looks the same everywhere and doesn't depend on what a machine has
       installed. Transparent behind it, so it sits on a light or a dark tab
       strip equally well. -->
  <g transform="skewX(-10) translate(5.5 0)">
    <path fill="#e2231a" fill-rule="evenodd" d="
      M 11 6 L 38 6
      C 49.5 6 55.5 12 55.5 20.5
      C 55.5 27.5 51.5 32.5 44 34.5
      L 58 58 L 40 58 L 29 38 L 24.5 38 L 24.5 58 L 11 58 Z
      M 24.5 16.5 L 36 16.5
      C 40.5 16.5 42.5 18 42.5 20.5
      C 42.5 23 40.5 24.5 36 24.5
      L 24.5 24.5 Z"/>
  </g>
</svg>
